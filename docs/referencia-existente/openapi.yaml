openapi: 3.1.0
info:
  title: LuziCity Public API
  version: 1.0.0
  description: API versionada de conteúdo e integrações da LuziCity.
servers:
  - url: /api/v1
tags:
  - name: Conteúdo
  - name: Autenticação
  - name: Documentação
paths:
  /news:
    get:
      tags: [Conteúdo]
      summary: Lista notícias publicadas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Página de notícias sem o corpo integral
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/News'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /categories:
    get:
      tags: [Conteúdo]
      summary: Lista categorias ativas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': {$ref: '#/components/responses/Paginated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /videos:
    get:
      tags: [Conteúdo]
      summary: Lista vídeos publicados
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': {$ref: '#/components/responses/Paginated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /podcasts:
    get:
      tags: [Conteúdo]
      summary: Lista episódios de podcast publicados
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': {$ref: '#/components/responses/Paginated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /events:
    get:
      tags: [Conteúdo]
      summary: Lista eventos locais ativos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': {$ref: '#/components/responses/Paginated'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/tokens:
    post:
      tags: [Autenticação]
      summary: Emite um token Bearer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
            example:
              email: usuario@example.com
              password: senha
              name: Aplicativo mobile
              abilities: [profile:read]
              expires_in_days: 30
      responses:
        '201':
          description: Token emitido; o valor não será exibido novamente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/me:
    get:
      tags: [Autenticação]
      summary: Retorna a conta do token
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Perfil autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [id, name, email, token_name, abilities]
                    properties:
                      id: {type: integer}
                      name: {type: string}
                      email: {type: string, format: email}
                      token_name: {type: string}
                      abilities: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/tokens/current:
    delete:
      tags: [Autenticação]
      summary: Revoga o token atual
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Token revogado
          content:
            application/json:
              example: {message: Token revogado.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /docs:
    get:
      tags: [Documentação]
      summary: Descoberta da documentação
      responses:
        '200':
          description: Links para OpenAPI e guia
  /docs/openapi.yaml:
    get:
      tags: [Documentação]
      summary: Especificação OpenAPI 3.1
      responses:
        '200':
          description: Documento YAML
          content:
            application/yaml: {}
  /docs/guide.md:
    get:
      tags: [Documentação]
      summary: Guia de uso em Markdown
      responses:
        '200':
          description: Guia com exemplos
          content:
            text/markdown: {}
  /mobile/auth/tokens:
    post:
      tags: [Autenticação]
      summary: Emite token com escopos mobile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '201': {description: Token mobile emitido}
        '422': {$ref: '#/components/responses/ValidationError'}
  /mobile/feed:
    get:
      tags: [Conteúdo]
      summary: Feed mobile do site atual
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200': {$ref: '#/components/responses/Paginated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /mobile/search:
    get:
      tags: [Conteúdo]
      summary: Busca de notícias no aplicativo
      security: [{bearerAuth: []}]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
        - $ref: '#/components/parameters/Page'
      responses:
        '200': {$ref: '#/components/responses/Paginated'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /mobile/favorites:
    get:
      tags: [Conteúdo]
      summary: Lista favoritos do usuário no site
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Paginated'}
  /mobile/favorites/{slug}:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
    post:
      tags: [Conteúdo]
      summary: Adiciona notícia aos favoritos
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Favorito criado}
        '200': {description: Favorito já existente}
    delete:
      tags: [Conteúdo]
      summary: Remove notícia dos favoritos
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Favorito removido}
  /mobile/notifications/devices:
    post:
      tags: [Autenticação]
      summary: Registra dispositivo para notificações
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Dispositivo registrado}
    delete:
      tags: [Autenticação]
      summary: Remove dispositivo de notificações
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Dispositivo removido}
  /mobile/profile:
    get:
      tags: [Autenticação]
      summary: Perfil do usuário mobile
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Perfil, site e total de favoritos"}
    patch:
      tags: [Autenticação]
      summary: Atualiza o nome do perfil
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Perfil atualizado}
        '422': {$ref: '#/components/responses/ValidationError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  schemas:
    News:
      type: object
      required: [id, slug, title, is_premium, is_sponsored, published_at, url]
      properties:
        id: {type: integer}
        slug: {type: string}
        title: {type: string}
        subtitle: {type: [string, 'null']}
        excerpt: {type: [string, 'null']}
        is_premium: {type: boolean}
        is_sponsored: {type: boolean}
        sponsor_label: {type: [string, 'null']}
        category: {type: [object, 'null']}
        author: {type: [object, 'null']}
        cover_image_url: {type: [string, 'null'], format: uri}
        published_at: {type: string, format: date-time}
        url: {type: string, format: uri}
    TokenRequest:
      type: object
      required: [email, password, name, abilities]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        name: {type: string, maxLength: 120}
        abilities:
          type: array
          minItems: 1
          items: {type: string, enum: [content:read, profile:read]}
        expires_in_days: {type: integer, minimum: 1, maximum: 365, default: 30}
    TokenResponse:
      type: object
      required: [token, token_type, abilities, expires_at]
      properties:
        token: {type: string, example: lzc_...}
        token_type: {type: string, const: Bearer}
        abilities: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}
    PaginationLinks:
      type: object
      properties:
        first: {type: string}
        last: {type: string}
        prev: {type: [string, 'null']}
        next: {type: [string, 'null']}
    PaginationMeta:
      type: object
      properties:
        current_page: {type: integer}
        from: {type: [integer, 'null']}
        last_page: {type: integer}
        per_page: {type: integer}
        to: {type: [integer, 'null']}
        total: {type: integer}
    PaginatedResponse:
      type: object
      required: [data, links, meta]
      properties:
        data: {type: array, items: {type: object}}
        links: {$ref: '#/components/schemas/PaginationLinks'}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
        errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
  responses:
    Paginated:
      description: Coleção paginada
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PaginatedResponse'}
    Unauthorized:
      description: Token ausente, inválido, expirado ou revogado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Escopo insuficiente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: Dados ou credenciais inválidos
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: Limite de requisições excedido
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
